  <polygon points="634,355 574,370 589,460 654,430" fill="#334155"/>
  <polygon points="435,460 470,500 425,540 370,500" fill="#0f172a"/>
  <polygon points="589,460 554,500 599,540 654,500" fill="#1e293b"/>

