  <polygon points="512,320 512,380 559,350" fill="#fbbf24"/>
  <!-- Hooked Beak Main Body -->
  <polygon points="512,380 470,440 512,500" fill="#d97706"/>
  <polygon points="512,380 512,500 554,440" fill="#f59e0b"/>
